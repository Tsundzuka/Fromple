# ============================================================
# .github/workflows/pipeline.yml
# ============================================================
# Runs the full processing chain after each OHLCV fetch:
#
#   indicators → conditions → class_engine
#              → signal_engine → paper_trade → registry
#
# Fires on the same cadence as fetch_ohlcv but offset by 2
# minutes so fresh bars are already in Redis when this starts.
#
# The script-level system_state.is_running gate makes every
# step a no-op when the pipeline is stopped, so wake-ups
# outside active windows cost nothing.
# ============================================================

name: pipeline

on:
  schedule:
    # Every 5 minutes, offset 2 min from fetch_ohlcv,
    # 22:00–21:59 UTC, Monday–Friday
    - cron: '2-59/5 22,23,0-21 * * 1-5'

  workflow_dispatch:

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Indicators
        env: &pipeline_env
          SUPABASE_URL:              ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TWELVEDATA_API_KEY:        ${{ secrets.TWELVEDATA_API_KEY }}
          UPSTASH_REDIS_REST_URL:    ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN:  ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: python -m src.indicators

      - name: Conditions
        env: *pipeline_env
        run: python -m src.conditions

      - name: Class engine
        env: *pipeline_env
        run: python -m src.class_engine

      - name: Signal engine
        env: *pipeline_env
        run: python -m src.signal_engine

      - name: Paper trade closer
        env: *pipeline_env
        run: python -m src.paper_trade

      - name: Registry aggregator
        env: *pipeline_env
        run: python -m src.registry

      - name: Log completion
        if: always()
        run: echo "pipeline finished at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
