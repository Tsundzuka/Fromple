<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fromple - Admin Users</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/admin.css" />
    <script type="module">
        import { requireAdmin } from '../js/auth-guard.js';
        await requireAdmin();
    </script>
</head>
<body>

    <!-- ========== HEADER ========== -->
    <div id="header"></div>

    <!-- ========== ADMIN WRAPPER ========== -->
    <div class="admin-wrapper">

        <!-- Sidebar -->
        <aside class="admin-sidebar" id="sidebar">
            <nav class="admin-nav">
                <a href="index.html" class="admin-nav-item">
                    <span class="nav-icon">📊</span>
                    <span>Dashboard</span>
                </a>
                <a href="users.html" class="admin-nav-item active">
                    <span class="nav-icon">👥</span>
                    <span>Users</span>
                    <span class="nav-badge" id="userCount">0</span>
                </a>
                <a href="campaigns.html" class="admin-nav-item">
                    <span class="nav-icon">📝</span>
                    <span>Campaigns</span>
                    <span class="nav-badge" id="campaignCount">0</span>
                </a>
                <a href="subscriptions.html" class="admin-nav-item">
                    <span class="nav-icon">💳</span>
                    <span>Subscriptions</span>
                </a>
                <a href="billing.html" class="admin-nav-item">
                    <span class="nav-icon">💰</span>
                    <span>Billing</span>
                </a>
                <a href="ai-usage.html" class="admin-nav-item">
                    <span class="nav-icon">🤖</span>
                    <span>AI Usage</span>
                </a>
                <a href="prompts.html" class="admin-nav-item">
                    <span class="nav-icon">📄</span>
                    <span>Prompts</span>
                </a>
                <a href="settings.html" class="admin-nav-item">
                    <span class="nav-icon">⚙️</span>
                    <span>Settings</span>
                </a>
                <a href="logs.html" class="admin-nav-item">
                    <span class="nav-icon">📋</span>
                    <span>Logs</span>
                </a>
                <a href="analytics.html" class="admin-nav-item">
                    <span class="nav-icon">📈</span>
                    <span>Analytics</span>
                </a>
            </nav>

            <div class="admin-sidebar-footer">
                <div class="admin-user">
                    <div class="admin-avatar">A</div>
                    <div>
                        <span class="admin-name">Admin</span>
                        <span class="admin-role">Super Admin</span>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="admin-main">

            <!-- Page Header -->
            <header class="admin-page-header">
                <div>
                    <!-- Toggle Button with Menu text -->
                    <button class="admin-sidebar-toggle" id="adminSidebarToggle" aria-label="Toggle navigation">
                        <span class="trigger-box">
                            <span class="trigger-line"></span>
                        </span>
                        <span class="menu-text">Menu</span>
                    </button>
                    <h1>User Management</h1>
                    <p class="page-subtitle">Manage all users on the platform.</p>
                </div>
                <div class="admin-header-actions">
                    <button class="btn-secondary btn-sm" onclick="exportUsers()">📥 Export</button>
                    <button class="btn-primary btn-sm" onclick="showAddUserModal()">➕ Add User</button>
                </div>
            </header>

            <!-- Filters -->
            <div class="admin-filters">
                <div class="filter-group">
                    <input type="text" class="filter-input" id="userSearch" placeholder="Search users..." oninput="filterUsers()" />
                    <select class="filter-select" id="userRoleFilter" onchange="filterUsers()">
                        <option value="all">All Roles</option>
                        <option value="admin">Admin</option>
                        <option value="user">User</option>
                        <option value="viewer">Viewer</option>
                    </select>
                    <select class="filter-select" id="userPlanFilter" onchange="filterUsers()">
                        <option value="all">All Plans</option>
                        <option value="free">Free</option>
                        <option value="professional">Professional</option>
                        <option value="growth">Growth</option>
                    </select>
                    <select class="filter-select" id="userStatusFilter" onchange="filterUsers()">
                        <option value="all">All Status</option>
                        <option value="active">Active</option>
                        <option value="suspended">Suspended</option>
                        <option value="pending">Pending</option>
                    </select>
                </div>
            </div>

            <!-- Users Table -->
            <div class="admin-card">
                <div class="admin-table-container">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>Plan</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Joined</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="usersTableBody">
                            <tr>
                                <td colspan="7" class="loading-text">Loading users...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="admin-table-footer">
                    <span class="table-info" id="userTableInfo">Showing 0 users</span>
                    <div class="table-pagination">
                        <button class="pagination-btn" onclick="prevPage()">←</button>
                        <span class="page-info" id="pageInfo">Page 1 of 1</span>
                        <button class="pagination-btn" onclick="nextPage()">→</button>
                    </div>
                </div>
            </div>

        </main>

    </div>

    <!-- ========== FOOTER ========== -->
    <div id="footer"></div>

    <!-- ========== MODAL ========== -->
    <div class="admin-modal" id="userModal" style="display:none;">
        <div class="admin-modal-content">
            <div class="admin-modal-header">
                <h2 id="modalTitle">Add User</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="admin-modal-body">
                <form id="userForm">
                    <div class="form-group">
                        <label>Full Name</label>
                        <input type="text" class="form-input" id="modalName" placeholder="John Doe" />
                    </div>
                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" class="form-input" id="modalEmail" placeholder="john@example.com" />
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Plan</label>
                            <select class="form-select" id="modalPlan">
                                <option value="free">Free</option>
                                <option value="professional">Professional</option>
                                <option value="growth">Growth</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select class="form-select" id="modalRole">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                                <option value="viewer">Viewer</option>
                            </select>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select class="form-select" id="modalStatus">
                            <option value="active">Active</option>
                            <option value="suspended">Suspended</option>
                            <option value="pending">Pending</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="admin-modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button class="btn-primary" onclick="saveUser()">Save User</button>
            </div>
        </div>
    </div>

    <!-- ========== SCRIPTS ========== -->
    <script src="../js/main.js"></script>
    <script src="../js/header.js"></script>
    <script src="../js/admin-footer.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
